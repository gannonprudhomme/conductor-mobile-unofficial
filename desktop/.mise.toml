[tasks.gen]
description = "Generate the native macOS Xcode project"
run = "scripts/gen.sh"

[tasks.build]
description = "Build the native macOS app"
depends = ["gen"]
run = "scripts/build.sh"

[tasks.run]
description = "Build and run the native macOS app"
depends = ["gen"]
run = "scripts/run.sh"

[tasks.release]
description = "Build, sign, notarize, and package a macOS release"
depends = ["gen"]
run = "scripts/release.sh \"$@\""

[tasks.publish]
description = "Build and upload a draft GitHub release"
depends = ["gen"]
run = "scripts/publish-release.sh \"$@\""
