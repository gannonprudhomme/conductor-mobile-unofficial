name: ConductorDesktop
options:
  bundleIdPrefix: com.gannonprudomme
  deploymentTarget:
    macOS: "26.0"
  minimumXcodeGenVersion: "2.45.0"
  xcodeVersion: "26.5"
packages:
  ConductorShared:
    path: ../shared
  ConductorDesktopModules:
    path: .
  SwiftLog:
    url: https://github.com/apple/swift-log
    from: 1.14.0
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
targets:
  ConductorDesktop:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: ConductorDesktop
      - path: ConductorDesktop/icon.icns
        buildPhase: resources
      - path: workspace-hook/bootstrap-loader.js
        buildPhase: resources
      - path: workspace-hook/browser-hook.mjs
        buildPhase: resources
    info:
      path: ConductorDesktop/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Conductor Mobile Companion
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconFile: icon.icns
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
    dependencies:
      - package: ConductorShared
        product: ConductorFoundation
      - package: ConductorShared
        product: SharedConductorDesign
      - package: ConductorDesktopModules
        product: ConductorMobileServer
      - package: SwiftLog
        product: Logging
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: com.gannonprudomme.conductor-sync-engine
        PRODUCT_MODULE_NAME: ConductorDesktop
        PRODUCT_NAME: Conductor Mobile Companion
schemes:
  ConductorDesktop:
    build:
      targets:
        ConductorDesktop: all
    run:
      config: Debug
