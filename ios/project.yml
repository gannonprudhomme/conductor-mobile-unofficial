name: ConductorMobile
options:
  bundleIdPrefix: build.conductor
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.5"
packages:
  ConductorModules:
    path: Modules
settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    COMPILATION_CACHE_ENABLE_CACHING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: iphoneos
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
targets:
  ConductorMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ConductorMobile
      - path: ConductorMobile/Fonts/Geist[wght].ttf
        buildPhase: resources
      - path: ConductorMobile/Fonts/GeistMono[wght].ttf
        buildPhase: resources
    info:
      path: ConductorMobile/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Conductor
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Geist[wght].ttf
          - GeistMono[wght].ttf
    dependencies:
      - package: ConductorModules
        product: ConductorDesign
      - package: ConductorModules
        product: ConductorMain
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1"
        PRODUCT_BUNDLE_IDENTIFIER: build.conductor.mobile
        PRODUCT_NAME: $(TARGET_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
  ConductorDataTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/Foundations/ConductorData/Tests
    dependencies:
      - package: ConductorModules
        product: ConductorData
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: build.conductor.mobile.ConductorDataTests
        PRODUCT_NAME: $(TARGET_NAME)
  ConductorWorkspacesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/ConductorWorkspaces/Tests
    dependencies:
      - package: ConductorModules
        product: ConductorWorkspaces
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: build.conductor.mobile.ConductorWorkspacesTests
        PRODUCT_NAME: $(TARGET_NAME)
  ConductorSessionsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/ConductorSessions/Tests
    dependencies:
      - package: ConductorModules
        product: ConductorSessions
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: build.conductor.mobile.ConductorSessionsTests
        PRODUCT_NAME: $(TARGET_NAME)
  ConductorMainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/ConductorMain/Tests
    dependencies:
      - package: ConductorModules
        product: ConductorMain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: build.conductor.mobile.ConductorMainTests
        PRODUCT_NAME: $(TARGET_NAME)
schemes:
  ConductorDataTests:
    build:
      targets:
        ConductorDataTests: test
    test:
      targets:
        - ConductorDataTests
  ConductorWorkspacesTests:
    build:
      targets:
        ConductorWorkspacesTests: test
    test:
      targets:
        - ConductorWorkspacesTests
  ConductorSessionsTests:
    build:
      targets:
        ConductorSessionsTests: test
    test:
      targets:
        - ConductorSessionsTests
  ConductorMainTests:
    build:
      targets:
        ConductorMainTests: test
    test:
      targets:
        - ConductorMainTests
