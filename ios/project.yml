name: ConductorMobile
options:
  bundleIdPrefix: build.conductor
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.5"
packages:
  ConductorModules:
    path: Modules
settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    COMPILATION_CACHE_ENABLE_CACHING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: iphoneos
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
targets:
  ConductorMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ConductorMobile
    dependencies:
      - package: ConductorModules
        product: ConductorMain
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Conductor
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        MARKETING_VERSION: "0.1"
        PRODUCT_BUNDLE_IDENTIFIER: build.conductor.mobile
        PRODUCT_NAME: $(TARGET_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
