name: ConductorMobile
options:
  bundleIdPrefix: com.gannonprudhomme
  deploymentTarget:
    iOS: "26.0"
  minimumXcodeGenVersion: "2.45.0"
  xcodeVersion: "26.5"
packages:
  ConductorShared:
    path: ../shared
  ConductorModules:
    path: Modules
  SwiftLog:
    url: https://github.com/apple/swift-log
    from: 1.14.0
settings:
  base:
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    COMPILATION_CACHE_ENABLE_CACHING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: iphoneos
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
targets:
  ConductorMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ConductorMobile
    info:
      path: ConductorMobile/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Conductor (unofficial)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: ConductorShared
        product: ConductorFoundation
      - package: ConductorModules
        product: ConductorMobileData
      - package: ConductorModules
        product: ConductorDesign
      - package: ConductorModules
        product: ConductorMain
      - package: SwiftLog
        product: Logging
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ConductorAppIcon
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: L4K4Q74X62
        MARKETING_VERSION: "0.1"
        PRODUCT_BUNDLE_IDENTIFIER: com.gannonprudhomme.conductor-mobile-unofficial
        PRODUCT_NAME: $(TARGET_NAME)
        TARGETED_DEVICE_FAMILY: "1,2"
  SharedConductorDataTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ../shared/SharedConductorData/Tests
    dependencies:
      - package: ConductorShared
        product: SharedConductorData
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gannonprudhomme.conductor-mobile-unofficial.SharedConductorDataTests
        PRODUCT_NAME: $(TARGET_NAME)
  ConductorMobileDataTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/Foundations/ConductorMobileData/Tests
    dependencies:
      - package: ConductorShared
        product: SharedConductorData
      - package: ConductorModules
        product: ConductorMobileData
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gannonprudhomme.conductor-mobile-unofficial.ConductorMobileDataTests
        PRODUCT_NAME: $(TARGET_NAME)
  ConductorDesignTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/ConductorDesign/Tests
    dependencies:
      - package: ConductorModules
        product: ConductorDesign
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gannonprudhomme.conductor-mobile-unofficial.ConductorDesignTests
        PRODUCT_NAME: $(TARGET_NAME)
  ConductorWorkspacesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/ConductorWorkspaces/Tests
    dependencies:
      - package: ConductorModules
        product: ConductorWorkspaces
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gannonprudhomme.conductor-mobile-unofficial.ConductorWorkspacesTests
        PRODUCT_NAME: $(TARGET_NAME)
  ConductorChatTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/ConductorChat/Tests
    dependencies:
      - package: ConductorModules
        product: ConductorChat
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gannonprudhomme.conductor-mobile-unofficial.ConductorChatTests
        PRODUCT_NAME: $(TARGET_NAME)
  ConductorMainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/ConductorMain/Tests
    dependencies:
      - package: ConductorModules
        product: ConductorMain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gannonprudhomme.conductor-mobile-unofficial.ConductorMainTests
        PRODUCT_NAME: $(TARGET_NAME)
  ConductorSettingsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Modules/ConductorSettings/Tests
    dependencies:
      - package: ConductorModules
        product: ConductorSettings
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: build.conductor.mobile.ConductorSettingsTests
        PRODUCT_NAME: $(TARGET_NAME)
schemes:
  ConductorMobile:
    build:
      targets:
        ConductorMobile: all
  ConductorChatTests:
    build:
      targets:
        ConductorChatTests: test
    test:
      targets:
        - ConductorChatTests
  SharedConductorDataTests:
    build:
      targets:
        SharedConductorDataTests: test
    test:
      targets:
        - SharedConductorDataTests
  ConductorMobileDataTests:
    build:
      targets:
        ConductorMobileDataTests: test
    test:
      targets:
        - ConductorMobileDataTests
  ConductorDesignTests:
    build:
      targets:
        ConductorDesignTests: test
    test:
      targets:
        - ConductorDesignTests
  ConductorWorkspacesTests:
    build:
      targets:
        ConductorWorkspacesTests: test
    test:
      targets:
        - ConductorWorkspacesTests
  ConductorMainTests:
    build:
      targets:
        ConductorMainTests: test
    test:
      targets:
        - ConductorMainTests
  ConductorSettingsTests:
    build:
      targets:
        ConductorSettingsTests: test
    test:
      targets:
        - ConductorSettingsTests
