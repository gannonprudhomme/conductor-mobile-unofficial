[tasks.gen]
description = "Generate the native iOS Xcode project"
run = "scripts/gen.sh"

[tasks.build]
description = "Build the native iOS app"
depends = ["gen"]
run = "scripts/build.sh"

[tasks.test]
description = "Run native iOS module tests"
depends = ["gen"]
run = "scripts/test.sh"

[tasks.deploy]
description = "Build and install the native iOS app to a destination"
depends = ["gen"]
usage = '''
arg "<destination>" help="xcodebuild destination, such as id=<UDID>"
flag "--attach" help="Stream simulator OS logs after installing"
'''
run = 'scripts/deploy.sh "${usage_destination}" ${usage_attach:+--attach}'
