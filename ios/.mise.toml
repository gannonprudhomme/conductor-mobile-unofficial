[tasks.gen]
description = "Generate the native iOS Xcode project"
run = "scripts/gen.sh"

[tasks.build]
description = "Build the native iOS app"
depends = ["gen"]
run = "scripts/build.sh"

[tasks.test]
description = "Run native iOS module tests on this worktree's simulator"
depends = ["gen"]
run = "scripts/test.sh"

[tasks.ui-test]
description = "Interact with Cloud browse UI on a dedicated simulator"
depends = ["gen"]
run = "bash scripts/ui-test.sh"

[tasks.deploy]
description = "Build, install, and launch the native iOS app"
depends = ["gen"]
usage = '''
arg "[destination]" help="xcodebuild destination, such as id=<UDID>"
flag "--attach" help="Attach the terminal to the app process after launching"
'''
run = 'scripts/deploy.sh ${usage_destination:+"${usage_destination}"} ${usage_attach:+--attach}'

[tasks.release]
description = "Archive and upload the native iOS app to TestFlight"
depends = ["gen"]
run = "scripts/release.sh \"$@\""

[tasks.run]
description = "Build, install, and launch the native iOS app on this worktree's simulator"
depends = ["gen"]
run = "scripts/deploy.sh --attach"

[tasks.clean-sims]
description = "Delete this worktree's simulator"
run = "scripts/worktree-sim.sh clean"
