[shell_alias]
mr = "mise run"

[tasks.deploy]
description = "Build, install, and launch the native iOS app"
run = "mise -C ios run deploy -- \"$@\""

[tasks.run]
description = "Build, install, and launch the native iOS app on this worktree's simulator"
run = "mise -C ios run run"

[tasks.xcode]
description = "Generate both native projects and open their Xcode workspace"
run = [
    "mise -C ios run gen",
    "mise -C desktop run gen",
    "open Conductor.xcworkspace",
]

[tasks.desktop]
description = "Build and run the native macOS app"
run = "mise -C desktop run run"

[tasks.test]
description = "Run native iOS module tests on this worktree's simulator"
run = "mise -C ios run test"

[tasks.clean-sims]
description = "Delete this worktree's simulator"
run = "mise -C ios run clean-sims"
